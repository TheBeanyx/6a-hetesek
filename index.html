<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6.A 3D Kocka Névpörgető</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #070a12;
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.25) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.22) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(6, 182, 212, 0.15) 0px, transparent 60%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* 3D Tér / Perspektíva */
    .scene {
      width: 90vw;
      max-width: 650px;
      height: 200px;
      perspective: 1200px;
    }

    /* A 3D Kocka Konténer */
    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform-origin: 50% 50% -100px; /* 100px = magasság fele */
    }

    /* A Kocka Oldalai */
    .cube-face {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(18, 24, 38, 0.75);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
      padding: 1.5rem 2rem;
      text-align: center;
      backface-visibility: hidden;
    }

    /* Neon világító keret a kocka mögött */
    .scene::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 36px;
      background: linear-gradient(135deg, #6366f1, #ec4899, #06b6d4);
      z-index: -1;
      opacity: 0.5;
      filter: blur(20px);
    }

    /* Különböző oldalak pozicionálása a 3D térben */
    .face-front {
      transform: rotateX(0deg) translateZ(100px);
    }

    .face-top {
      transform: rotateX(-90deg) translateZ(100px);
    }

    /* A nevek szövegstílusa */
    .name-text {
      font-size: clamp(1.8rem, 4.5vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 20%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }
  </style>
</head>
<body>

  <!-- Csak ez az 1 doboz van az egész oldalon -->
  <div class="scene">
    <div class="cube" id="cube">
      <div class="cube-face face-front">
        <span class="name-text" id="front-text"></span>
      </div>
      <div class="cube-face face-top">
        <span class="name-text" id="top-text"></span>
      </div>
    </div>
  </div>

  <script>
    // A kiolvasott 22 név
    const names = [
      "Árpási Panni",
      "Bertók Márton",
      "Buzás Benedek",
      "Egenhoffer-Végh Edvard Fülöp",
      "Gamble Elenor Mae",
      "Guardado Alexander Joaqiun",
      "Hazuga Károly",
      "Hegyháti Rozália",
      "Hommonay Márton",
      "Kiss Trisztán",
      "Körössy Gréti",
      "Laki Johanna",
      "Marczali Dion",
      "Papp Márton",
      "Parádi Nimród",
      "Radics Tímea",
      "Révész Barnabás",
      "Staudt Márk",
      "Tokai-Barak Márk",
      "Szabó Flóra",
      "Vámosi-Nagy Szonja",
      "Vitári Mátyás"
    ];

    let currentIndex = 0;
    const cube = document.getElementById('cube');
    const frontText = document.getElementById('front-text');
    const topText = document.getElementById('top-text');

    // Első név betöltése
    frontText.textContent = names[currentIndex];

    // Másodpercenkénti 3D kocka fordítás fentről lefelé
    setInterval(() => {
      const nextIndex = (currentIndex + 1) % names.length;
      
      // 1. Felkészítjük a felső (érkező) oldalt az új névvel
      topText.textContent = names[nextIndex];

      // 2. Rádobjuk a 3D fordítási animációt (fentről lefelé forgatás)
      cube.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.25, 0.64, 1)';
      cube.style.transform = 'rotateX(90deg)';

      // 3. Amikor az átfordulás befejeződött (500 ms múlva):
      setTimeout(() => {
        // Átmásoljuk az új nevet az elülső oldalra
        frontText.textContent = names[nextIndex];
        
        // Animáció nélkül visszaurasztjuk az alapállapotba
        cube.style.transition = 'none';
        cube.style.transform = 'rotateX(0deg)';
        
        // Léptetjük az indexet
        currentIndex = nextIndex;
      }, 500);

    }, 1000);
  </script>

</body>
</html>
